name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    # Fijo en 24.04: es el Ubuntu mas nuevo donde setup-python todavia trae 3.8,
    # y el proyecto promete 3.8+ (pyproject y README). ubuntu-latest ya es 26.04.
    runs-on: ubuntu-24.04
    strategy:
      # Que una version que truene no cancele la otra: se ve el resultado de ambas.
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Importar el paquete
        run: python -c "import ktool; print(ktool.__version__)"

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Resolver una tabla (minterminos)
        run: python -m ktool -n 3 -m 1,4,5,6 -d 2,7 --text

      - name: Resolver desde expresion
        run: python -m ktool -e "A^B^C" --text

      - name: Generar documento HTML
        run: python -m ktool -n 4 -m 0,1,2,3,8,9 --out /tmp/out.html
